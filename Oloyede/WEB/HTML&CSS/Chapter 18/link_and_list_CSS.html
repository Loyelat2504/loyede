<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in CSS</title>
    <style>
        ul {
                list-style-type: none;
        }
        li {
            float: left;
            width: 100px;
            height: 50px;
            background-color: rgb(62, 149, 81);
            margin-left: 25px;
            text-align: center;
            

        }
        li {
            animation: intriguing 3s ease 1s infinite alternate;
        }
        @keyframes intriguing {
            from {
                background-color: green;
            }
            to {
                background-color: white;
            }
        }
        a {
            text-decoration: none;
            display: inline-block;
            margin-top: 50px;
            background-color: black;
            color: white;

        }
        a:hover {
            background-color: cadetblue;
            color: blue;
        }
        a:active {
            background-color: antiquewhite;
           
        }
        a:visited {
            color: brown;
            
        }
    </style>
</head>
<body>
    <ul>
        <li>green</li>
          <li>green</li>
            <li>green</li>
              <li>green</li>
                <li>green</li>
    </ul>
    <!-- <br><br><br><br> -->
    <a href="#">link to My Linkedlin</a>
</body>
</html>
