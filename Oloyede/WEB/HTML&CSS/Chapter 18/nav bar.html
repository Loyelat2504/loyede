<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav Bar</title>
    <style>
        ul {
            list-style-type: none;

        }
        ul li {
            float: left;
            padding: 10px;
        }
        ul li a {
            color: rgb(255, 0, 0);
            text-decoration: none;
            padding: 20px;

        
        }
        ul li a:hover {
            background-color: yellow;
            color: cadetblue;
        }
        #sharp {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
<ul>
        <li><a href="#">green</a></li>
          <li><a href="#" id="sharp">green</a></li>
            <li><a href="#">green</a></li>
              <li><a href="#">green</a></li>
                <li><a href="#">green</a></li>
    </ul>
</body>
</html>
