d<!DOCTYPE html>
<html lang="en">
<head>
    <title>Navigation in CSS</title>
    <style>
        body {background-color: black; font-family: Verdana, Geneva, Tahoma, sans-serif; margin: 0%}
        nav {
            margin: 0;
            display: inline-block;
            width: 100%;
            height: 90px;
            background-color: rgba(55, 149, 55, 0.484);
        }
        nav ul {
            margin: 0;padding: 0;
            list-style-type: none;
            
        }
        nav ul li {
            position: relative;
            /* margin: 0 20px 0 0; it is the same with the beneath property*/
            margin-right: 30px;
            display: inline-block;
            float: left;
        }
        nav ul li a{
            display: inline-block;
            font-size: 25px;
            padding: 25px;
            text-decoration: none;
            color: aqua;
        }
        nav ul li a:hover {
            opacity: 0.4;
        }
        nav ul li ul {
            display: none;
            /* float: left; */
            background-color: rgb(164, 112, 33);
            position: absolute;
        }
        nav ul li ul li { 
                        /* margin-left: 5px; */
                        color: black;
                        width: 100%;
        }
        nav ul li:hover ul {
            display: block;
        }
 
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Courses</a>
                <ul>
                    <li><a href="#">HTML</a></li>
                    <li><a href="#">CSS</a></li>
                    <li><a href="#">JavaScript</a></li>
                    <li><a href="#">Python</a></li>
                    <li><a href="#">Java</a></li>
                </ul>
            </li>
            <li><a href="#">Contact Us</a>
                <ul>
                    <li><a href="#">Phone</a></li>
                    <li><a href="#">WhatsApp</a></li>
                    <li><a href="#">Address</a></li>
                </ul>
            </li>
            <li><a href="#">Projects</a></li>
        </ul>
    </nav>
</body>
</html>
