<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broski</title>
    <style>
        ul{
            list-style-type: none;
        }
        ul li {
            float:left;
            padding: 20px;
        }
        ul li a {
            color: rgb(242, 0, 255);
            display: inline-block;
            padding: 20px;
            text-decoration: none;
        }
        ul li a:hover {
            background-color: pink;
            color: rgb(0, 255, 4);
        }
        ul li #pet {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#">Green</a></li>
        <li><a href="#">Pink</a></li>
        <li><a href="#">Blue</a></li>
        <li><a href="#" id="pet">Yellow</a></li>
        <li><a href="#">Brown</a></li>
        <li><a href="#">Indigo</a></li>
    </ul>
</body>
</html>
