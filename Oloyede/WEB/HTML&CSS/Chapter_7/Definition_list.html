<html lang="en">
<head>
    <style>
        dl {
            background-color: indianred;
            display: inline-block;
        }
        dl dt {
            color: aqua;
        }
        dl dd {
            color: rgb(127, 208, 255);
        }

    <title>Definition List in HTML</title>
</head>

    <dl>
        <dt>HTML</dt>
        <dd>HTML is a web Language that is used to create a Website</dd>
        <dt>CSS</dt>
        <dd>CSS is a spread sheet that is used to design a website</dd>
    </dl>
</body>
</html>
