<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Font</title>
    <style>
        div {
            font-variant: small-caps;
            font-weight: bold;
        }
        h1 {
            font-family: cursive;
            font-style: oblique;
            font-size: xx-large;
            font-weight: inherit;
            font-variant: inherit;
        }
        p {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            font-size: 50px;
            font-weight: 400px;
            font-variant: small-caps;
        }
    </style>
</head>
<body>
    <div>
    <h1>Loyelatcode...</h1>
    </div>

    <p>Welcome</p>
</body>
</html>
