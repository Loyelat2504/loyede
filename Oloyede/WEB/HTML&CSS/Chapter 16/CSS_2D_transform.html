<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 2D Transform</title>
    <style>
        div {
            width: 300px;
            height: 300px;
            background-color: grey;
            margin-top: 300px;
            margin-left: 200px;
            color: white;
            font-size: larger;
            transform: skew(30deg, 20deg);
        }
        p {
            margin-left: 90px;
        }

    </style>
</head>
<body>
    <div>
        <p>what's going on guys</p>
    </div>
    <!--
     transform:
     translate(x value, y value)
     translateY(40px)
     translateX(40px)
     rotate(deg)
     scaleX(2)
     scaleY(2)
     scale(1,1)
     skewX(20deg)
     skewY(30deg)
     skew(20deg, 30deg)
      -->
</body>
</html>
