<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Element</title>
</head>
<body>
    <form action="">
    <label for="firstname">First Name:</label>
    <input type="text" name="firstname" id="firstname" placeholder="required" required>
<br>
    <select name="favourite_player" size="5" id="favourite_player" multiple>
        <option value="Messi" selected>Messi</option>
        <option value="Ronaldo">Ronaldo</option>
        <option value="Neymar">Neymar</option>
        <option value="Bale">Bale</option>
        <option value="Mbappe">Mbappe</option>
    </select>
<br>
    <select name="favourite_player" id="any_favourite_player">
        <option value="Messi">Messi</option>
        <option value="Ronaldo">Ronaldo</option>
        <option value="Neymar">Neymar</option>
        <option value="Bale">Bale</option>
        <option value="Mbappe">Mbappe</option>
    </select>
    <br>
    <input type="submit">
    </form>
</body>
</html>
