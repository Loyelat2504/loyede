<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute of Input Element</title>
</head>
<body>
    <form action="">
       User Name: <input type="text" name="User" id="user_name" placeholder="optional"><br><br>
       Fisrt Name: <input type="text" name="fisrt_name" id="fisrt_name" autofocus size="40" placeholder="please input your name" required><br><br>
       Last Name: <input type="text" name="Last" id="user_name" value="Ibrahim" readonly><br><br>
       School: <input type="text" name="School" value="FOMWAN COMPREHENSIVE COLLEGE, INISA." id="School" size="50" disabled><br><br>
       Telephone: <input type="tel" name="phonenumber" id="phonenumber" value="+234" maxlength="14"><br><br>
       Age: <input type="number" name="Age" id="Age" min="16" max="25" step="2"><br><br>
       Image <input type="image" src="mp.jpg" width="100px" height="100" id="image"><br><br>
       <input type="submit">
    </form>
</body>
</html>
