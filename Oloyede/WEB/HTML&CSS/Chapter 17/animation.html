<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation in CSS</title>
</head>
<style>
    body {
        background-color: black;
        animation: sharp 3s ease 1s infinite alternate;
        border: 30px rgb(19, 148, 184) solid;
        margin: ;
    }
    @keyframes sharp {
            from {
                background-color: blueviolet;
            }
            to {
                background-color: brown;
            }
       
    }
    div {
        background-color: aquamarine;
        width: 200px;
        height: 200px;
        font-size: xx-large;
        border: 3px green solid;
        animation-name: example;
        animation-duration: 2s;
        animation-timing-function: linear;
        animation-delay: 1s;
        animation-iteration-count: 5;
        animation-direction:normal;
    }
    @keyframes example {
        from {
            background-color: rgb(224, 27, 27);
        }
        to {
            background-color: rgb(36, 211, 56);
        }
    }
    

</style>
<body>
<div>
    <span>Can you feel it?</span>
</div>    
</body>
</html>
