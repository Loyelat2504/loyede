<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
       #short {
            width: 300px;
            height: 200px;
            border: 5px solid rgb(177, 21, 130);
            background-color: blue;
            transition-property: background, color, width, height;
            transition-duration: 5s;
            transition-timing-function: ease;
            color: white;
            font-size: xx-large
        }
        #short:hover {
            background-color: rgb(226, 174, 43);
            width: 500px;
            color: red;
            height: 100px;

        }
        #fast {
            width: 200px;
            height: 100px;
            color: indigo;
            background-color: rgb(200, 86, 86);
            font-size: xx-large;
            transition-property: all;
            transition-duration: 4s;
            transition-delay: 1s;
            transition-timing-function: cubic-bezier(0.075, 0.82, 0.165, 1);
        }
        #fast:hover {
                        width: 300px;
                        height: 150px;
                        background-color: antiquewhite;
                        color: blue;
        }
        #sure {
            height: 100px;
            width: 200px;
            background-color: black;
            color: rgb(144, 76, 76);
            font-size: larger;
            transition: all, 4s ease 1s;
            text-align: center;

        }
        #sure:hover {
                        height: 200px;
                        width: 300px;
                        background-color: blue;
                        color: chartreuse;
        }
        input {
            color: green;
            font-weight: bolder;
            width: 200px;
            transition: all 3s ease;
        }
        input:focus {
            width: 300px;
        }

    </style>
</head>
<body>
    <div id="short">
        what's going on? what are you learinig guy
    </div>
    <br>
    <div id="fast">
        wow! That's great
    </div><br>
    <div id="sure">General</div><br>
    <input type="text">
</body>
</html>
