<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Transition Test</title>
    <style>
        .t1 {
            width: 200px;
            height: 200px;
            padding-top: 100px;
            background-color: blue;
            color: white;
            text-align: center;
            font-weight: bolder;
            font-size: larger;
            transition: all 3s ease-in-out 1s;
        }
        .t1:hover {
            width: 300px;
            height: 300px;
            background-color: blueviolet;
            color: greenyellow;
        }
    </style>
</head>
<body bgcolor="yellow">
    <div class="t1">
        I'm Bored
    </div>
</body>
</html>
