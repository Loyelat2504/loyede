<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 2D Transform</title>
    <style>
        #ssp {
            width: 300px;
            height: 300px;
            background-color: grey;
            margin-top: 200px;
            margin-left: 200px;
            color: white;
            font-size: larger;
            /* transform: translateX(-50px);
            transform: translateY(-70px); */
            transform: translate(-60px, -70px);
            transform: rotate(15deg);
        }
        #sp {
            width: 300px;
            height: 300px;
            background-color: grey;
            /* margin-top: 200px; */
            margin-left: 200px;
            color: white;
            font-size: x-large;
            /* transform: translateX(-50px);
            transform: translateY(-70px); */
            transform: translate(90px, -70px);
            transform: scale(2, 1.5);
            transform: skew(10deg, 15deg);
        }
        p {
            margin-left: 50px;
        }

    </style>
</head>
<body>
    <div id="ssp">
        <p>what's going on guys</p>
    </div>
    <div id="sp">
        <p>what's going on guys</p>
    </div>
    <!--
     transform:
     translate(x value, y value)
     translateY(40px)
     translateX(40px)
     rotate(deg)
     scaleX(2)
     scaleY(2)
     scale(1,1)
     skewX(20deg)
     skewY(30deg)
     skew(20deg, 30deg)
      -->
</body>
</html>
