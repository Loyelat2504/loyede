<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Test</title>
    <style>
        body {
            background-color: blue;
            animation-name: body;
            animation-duration: 5s;
            animation-timing-function: ease-in;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }
        @keyframes body {
            from {
                background-color: darkblue;
            }
            to {
                background-color: green;
            }
        }
       div {
        width: 500px;
        height: 300px;
        color: black;
        font-size: 60px;
        font-weight: 300;
        font-style: italic;
        text-align: center;
        animation: tipre 3s cubic-bezier(0.075, 0.82, 0.165, 1) 1s infinite alternate;
        
       }
         @keyframes tipre {
            from {
                background-color: aquamarine;
            }
            to {
                background-image: url(log.jpg);
            }
        }
    </style>
</head>
<body>
    <div>wow!😯😲</div>
</body>
</html>
