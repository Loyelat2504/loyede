<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Transform</title>
    <style>
        #main {
            width: 100%;
            height: 100%;
            background-color: rgb(4, 204, 47);
            margin-top: 100px;
            margin-left: 100px;
        }
        #box {
            width: 300px;
            height: 200px;
            margin-top: 100px;
            transform: perspective(250px) scale3d(1,1,1); color: #000;
        }
        .tata {
            width: 300px;
            height: 200px;
            background-color: grey;
            margin-top: 100px;
            transform: rotate3d(2,4,6,30deg) translate(300px,50px) skewx(30deg);
    
        }
        #start:hover {
            color: aqua;

        }
        #stop:hover {
            color:  #cd2525;
        }
            </style>
</head>
<body>
    <div id="main">
        <div id="box">
            
        </div>
        <a href="another assignment.html" id="start">Check this out</a><br><br>
            <a href="another assignment.html" id="stop">Check out</a>
    </div>
    <div class="tata"></div>
</body>
</html>
